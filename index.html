<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>Simple Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f5f7ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: radial-gradient(ellipse at top, #252b3d 0, #10131c 60%);
    }

    .calculator {
      width: min(100%, 360px);
      padding: 1.25rem;
      border: 1px solid #343a4d;
      border-radius: 1.5rem;
      background: #191d29;
      box-shadow: 0 24px 70px #0008;
    }

    h1 {
      margin: 0 0 1rem;
      color: #aeb8d2;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    .display {
      min-height: 5.5rem;
      display: flex;
      align-items: end;
      justify-content: end;
      overflow: hidden;
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: 0.9rem;
      background: #10131c;
      color: #fff;
      font-size: clamp(2rem, 12vw, 3rem);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.65rem;
    }

    button {
      min-height: 3.8rem;
      border: 0;
      border-radius: 0.9rem;
      background: #292e3d;
      color: #f5f7ff;
      font: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #383e50; }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 2px solid #aeb8ff; outline-offset: 2px; }
    button.utility { background: #383e50; color: #cbd2e5; }
    button.operator { background: #343c60; color: #cbd3ff; }
    button.equals { background: #7888ff; color: #10131c; font-weight: 700; }
    button.equals:hover { background: #94a0ff; }
    button.zero { grid-column: span 2; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <output class="display" id="display" aria-live="polite" aria-atomic="true">0</output>
    <div class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear" aria-label="Clear">AC</button>
      <button class="utility" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="utility" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" data-operator="÷" aria-label="Divide">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="×" aria-label="Multiply">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="−" aria-label="Subtract">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="operator" data-operator="+" aria-label="Add">+</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    let displayValue = "0";
    let storedValue = null;
    let pendingOperator = null;
    let waitingForOperand = false;

    function updateDisplay() {
      display.textContent = displayValue;
    }

    function enterDigit(digit) {
      if (waitingForOperand) {
        displayValue = digit;
        waitingForOperand = false;
      } else if (displayValue === "0") {
        displayValue = digit;
      } else if (displayValue.replace("-", "").length < 12) {
        displayValue += digit;
      }
      updateDisplay();
    }

    function enterDecimal() {
      if (waitingForOperand) {
        displayValue = "0.";
        waitingForOperand = false;
      } else if (!displayValue.includes(".")) {
        displayValue += ".";
      }
      updateDisplay();
    }

    function calculate(left, right, operator) {
      switch (operator) {
        case "+": return left + right;
        case "−": return left - right;
        case "×": return left * right;
        case "÷": return right === 0 ? NaN : left / right;
        default: return right;
      }
    }

    function formatResult(value) {
      if (!Number.isFinite(value)) return "Error";
      return String(Number(value.toPrecision(10)));
    }

    function chooseOperator(operator) {
      const currentValue = Number(displayValue);
      if (pendingOperator && !waitingForOperand) {
        const result = calculate(storedValue, currentValue, pendingOperator);
        displayValue = formatResult(result);
        storedValue = result;
        updateDisplay();
      } else {
        storedValue = currentValue;
      }
      pendingOperator = operator;
      waitingForOperand = true;
    }

    function performAction(action) {
      if (action === "clear") {
        displayValue = "0";
        storedValue = null;
        pendingOperator = null;
        waitingForOperand = false;
      } else if (action === "sign" && displayValue !== "Error") {
        displayValue = formatResult(-Number(displayValue));
      } else if (action === "percent" && displayValue !== "Error") {
        displayValue = formatResult(Number(displayValue) / 100);
      } else if (action === "decimal" && displayValue !== "Error") {
        enterDecimal();
        return;
      } else if (action === "equals" && pendingOperator && storedValue !== null) {
        displayValue = formatResult(calculate(storedValue, Number(displayValue), pendingOperator));
        storedValue = null;
        pendingOperator = null;
        waitingForOperand = true;
      }
      updateDisplay();
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.digit !== undefined) {
        if (displayValue === "Error") displayValue = "0";
        enterDigit(button.dataset.digit);
      } else if (button.dataset.operator) {
        if (displayValue === "Error") return;
        chooseOperator(button.dataset.operator);
      } else {
        performAction(button.dataset.action);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) {
        if (displayValue === "Error") displayValue = "0";
        enterDigit(event.key);
      } else if (event.key === ".") {
        if (displayValue !== "Error") enterDecimal();
      } else if (["+", "-", "*", "/"].includes(event.key)) {
        if (displayValue !== "Error") {
          chooseOperator(({ "+": "+", "-": "−", "*": "×", "/": "÷" })[event.key]);
        }
      } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        performAction("equals");
      } else if (event.key === "Escape") {
        performAction("clear");
      } else if (event.key === "Backspace" && displayValue !== "Error") {
        displayValue = displayValue.length > 1 ? displayValue.slice(0, -1) : "0";
        if (displayValue === "-") displayValue = "0";
        updateDisplay();
      }
    });
  </script>
</body>
</html>
